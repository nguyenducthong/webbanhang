server:
  port: 8088

spring:
  datasource:
    url: jdbc:h2:mem:fashion_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

fashion:
  outbox:
    poll-interval-ms: 10000
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin_password

